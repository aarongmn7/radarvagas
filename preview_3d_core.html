<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AARON.DEV // 3D Geodesic Lattice Globe V4 (Smooth Continents + Diagonal Spin)</title>
  <style>
    :root {
      --bg: #050507;
      --text: #fafafa;
      --muted: #a1a1aa;
      --border: #27272a;
    }
    body.light {
      --bg: #f4f4f6;
      --text: #09090b;
      --muted: #52525b;
      --border: #d4d4d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.3s ease;
    }
    #canvas-container {
      width: 580px;
      height: 580px;
      position: relative;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }
    .hud {
      position: fixed;
      top: 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(24, 24, 27, 0.88);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .hud span {
      font-size: 12px;
      font-family: monospace;
      letter-spacing: 0.06em;
      color: #e4e4e7;
    }
    .btn {
      background: #18181b;
      color: #fff;
      border: 1px solid #3f3f46;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { border-color: #fff; transform: translateY(-1px); }
    .caption {
      margin-top: 6px;
      font-family: monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="hud">
    <span>// V4: CONTINENTES VETORIAIS LISOS (ZERO PIXELADO) + LUZ INVISÍVEL + GIRO DIAGONAL</span>
    <button class="btn" id="btnFaceMap">🌎 Focar Globo</button>
    <button class="btn" id="btnFaceLogo">🎯 Focar Logo 3D</button>
    <button class="btn" id="btnAuto">🔄 Giro Diagonal</button>
    <button class="btn" id="btnTheme">🌗 Tema</button>
  </div>

  <div id="canvas-container"></div>
  <div class="caption" id="statusText">Construindo malha 3D vetorial lisa dos continentes (Zero Pixelado)...</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const statusText = document.getElementById('statusText');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000);
    camera.position.set(0, 0, 6.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(580, 580);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    container.appendChild(renderer.domElement);

    // Pivot externo inclinado na diagonal (axial tilt ~28 graus) para rodar elegante na diagonal!
    const tiltPivot = new THREE.Group();
    tiltPivot.rotation.z = -0.45; // Inclinação diagonal do eixo de rotação
    tiltPivot.rotation.x = 0.18;
    scene.add(tiltPivot);

    const coreGroup = new THREE.Group();
    tiltPivot.add(coreGroup);

    // =========================================================================
    // ILUMINAÇÃO + LUZES INTERNAS INVISÍVEIS (Sem nenhuma bola branca no meio!)
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.45);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.8);
    keyLight.position.set(5, 6, 7);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xd4d4d8, 2.8);
    fillLight.position.set(-6, -3, 5);
    scene.add(fillLight);

    const backRimLight = new THREE.DirectionalLight(0xffffff, 3.2);
    backRimLight.position.set(0, 5, -6);
    scene.add(backRimLight);

    // Luzes internas puras (PointLights invisíveis! Iluminam a logo e a treliça por dentro sem bola visível)
    const innerLightCenter = new THREE.PointLight(0xffffff, 6.5, 5.5);
    innerLightCenter.position.set(0, 0, 0);
    coreGroup.add(innerLightCenter);

    const innerLightFront = new THREE.PointLight(0xffffff, 4.0, 4.5);
    innerLightFront.position.set(0, 0, 0.65);
    coreGroup.add(innerLightFront);

    const innerLightBack = new THREE.PointLight(0xe4e4e7, 4.0, 4.5);
    innerLightBack.position.set(0, 0, -0.65);
    coreGroup.add(innerLightBack);

    const RADIUS = 1.78;

    // Materiais Metálicos / Carbono Acetinado de Alto Contraste
    const darkStrutMat = new THREE.MeshStandardMaterial({
      color: 0x1a1a20,
      roughness: 0.38,
      metalness: 0.55
    });

    const continentArmorMat = new THREE.MeshStandardMaterial({
      color: 0x2f2f38,
      roughness: 0.28,
      metalness: 0.65
    });

    const brazilHighlightMat = new THREE.MeshStandardMaterial({
      color: 0x52525b,
      roughness: 0.22,
      metalness: 0.78
    });

    const logoArmorMat = new THREE.MeshStandardMaterial({
      color: 0x2e2e36,
      roughness: 0.24,
      metalness: 0.72
    });

    const accentTitaniumMat = new THREE.MeshStandardMaterial({
      color: 0x8e8e99,
      roughness: 0.2,
      metalness: 0.85
    });

    // =========================================================================
    // 1. GAIOLA GEODÉSICA TRIANGULAR VAZADA (Treliça 3D igual à referência)
    // =========================================================================
    function buildHollowGeodesicStruts(radius, detail, strutRadius) {
      const ico = new THREE.IcosahedronGeometry(radius, detail);
      const pos = ico.attributes.position;
      const edgesMap = new Map();

      function addEdge(i1, i2) {
        const v1 = new THREE.Vector3().fromBufferAttribute(pos, i1);
        const v2 = new THREE.Vector3().fromBufferAttribute(pos, i2);
        if (v1.z > 0.06 && v2.z > 0.06) return;

        const k1 = `${v1.x.toFixed(3)},${v1.y.toFixed(3)},${v1.z.toFixed(3)}`;
        const k2 = `${v2.x.toFixed(3)},${v2.y.toFixed(3)},${v2.z.toFixed(3)}`;
        const key = k1 < k2 ? `${k1}|${k2}` : `${k2}|${k1}`;
        if (!edgesMap.has(key)) {
          edgesMap.set(key, [v1, v2]);
        }
      }

      for (let i = 0; i < pos.count; i += 3) {
        addEdge(i, i + 1);
        addEdge(i + 1, i + 2);
        addEdge(i + 2, i);
      }

      const strutGroup = new THREE.Group();
      const up = new THREE.Vector3(0, 1, 0);

      for (const [v1, v2] of edgesMap.values()) {
        const dir = new THREE.Vector3().subVectors(v2, v1);
        const len = dir.length();
        const cylGeo = new THREE.CylinderGeometry(strutRadius, strutRadius, len, 10);
        const mesh = new THREE.Mesh(cylGeo, darkStrutMat);

        const mid = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);
        mesh.position.copy(mid);
        mesh.quaternion.setFromUnitVectors(up, dir.normalize());
        strutGroup.add(mesh);
      }

      return strutGroup;
    }

    const geodesicCage = buildHollowGeodesicStruts(RADIUS, 3, 0.022);
    coreGroup.add(geodesicCage);

    // Anel Equatorial Estrutural
    const equatorTorusGeo = new THREE.TorusGeometry(RADIUS, 0.052, 24, 108);
    coreGroup.add(new THREE.Mesh(equatorTorusGeo, logoArmorMat));

    // =========================================================================
    // 2. CONTINENTES VETORIAIS LISOS CURVADOS NA ESFERA (ZERO PIXELADO!)
    // Em vez de quadradinhos pixelados, triangulamos os polígonos vetoriais reais
    // do GeoJSON com `THREE.ShapeUtils.triangulateShape`, subdividimos os triângulos
    // internos e projetamos suavemente na curvatura exata da esfera com parede 3D!
    // =========================================================================
    const continentsGroup = new THREE.Group();
    coreGroup.add(continentsGroup);

    // Converte (lon, lat) para ponto 3D na meia-esfera traseira com Brasil centralizado
    function mapWorldLonLatToSphereVec3(lon, lat, r) {
      const centerLon = -38; // Brasil e Atlântico centralizados
      let dLon = lon - centerLon;
      while (dLon < -180) dLon += 360;
      while (dLon > 180) dLon -= 360;

      const azimuth = (dLon / 180) * (Math.PI * 0.485);
      const latRad = (lat * Math.PI) / 180 * 0.88;

      const x = -r * Math.cos(latRad) * Math.sin(azimuth);
      const y = r * Math.sin(latRad);
      const z = -r * Math.cos(latRad) * Math.cos(azimuth);
      return new THREE.Vector3(x, y, z);
    }

    // Subdivide um triângulo 2D (lon, lat) recursivamente se suas arestas forem longas,
    // garantindo que o continente curve perfeitamente redondo sobre a esfera sem quinas retas!
    function subdivideTriangle2D(p0, p1, p2, maxDeg, outTriangles) {
      const d01 = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      const d12 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const d20 = Math.hypot(p0.x - p2.x, p0.y - p2.y);

      if (Math.max(d01, d12, d20) <= maxDeg) {
        outTriangles.push([p0, p1, p2]);
        return;
      }

      const m01 = new THREE.Vector2((p0.x + p1.x) * 0.5, (p0.y + p1.y) * 0.5);
      const m12 = new THREE.Vector2((p1.x + p2.x) * 0.5, (p1.y + p2.y) * 0.5);
      const m20 = new THREE.Vector2((p2.x + p0.x) * 0.5, (p2.y + p0.y) * 0.5);

      subdivideTriangle2D(p0, m01, m20, maxDeg, outTriangles);
      subdivideTriangle2D(m01, p1, m12, maxDeg, outTriangles);
      subdivideTriangle2D(m20, m12, p2, maxDeg, outTriangles);
      subdivideTriangle2D(m01, m12, m20, maxDeg, outTriangles);
    }

    // Densifica as bordas costeiras para acompanhar a curvatura da esfera com precisão cirúrgica
    function densifyRing(ringCoords, maxStepDeg = 2.2) {
      const pts = [];
      for (let i = 0; i < ringCoords.length - 1; i++) {
        const [lonA, latA] = ringCoords[i];
        const [lonB, latB] = ringCoords[i + 1];
        // Evita linhas cruzando o antimeridiano
        if (Math.abs(lonB - lonA) > 120) continue;
        const dist = Math.hypot(lonB - lonA, latB - latA);
        const steps = Math.max(1, Math.ceil(dist / maxStepDeg));
        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          pts.push(new THREE.Vector2(lonA + (lonB - lonA) * t, latA + (latB - latA) * t));
        }
      }
      // Remove duplicados consecutivos
      const clean = [];
      for (const p of pts) {
        if (clean.length === 0 || p.distanceTo(clean[clean.length - 1]) > 0.05) {
          clean.push(p);
        }
      }
      return clean;
    }

    function buildSmoothSphericalPolygonBuffers(ringCoords, innerR, outerR, posArr, normArr) {
      const contour = densifyRing(ringCoords, 2.0);
      if (contour.length < 3) return;

      // Verifica orientação (garante CCW para triangulação limpa)
      if (THREE.ShapeUtils.isClockWise(contour)) {
        contour.reverse();
      }

      const faces = THREE.ShapeUtils.triangulateShape(contour, []);
      const fineTriangles = [];

      for (const [i0, i1, i2] of faces) {
        subdivideTriangle2D(contour[i0], contour[i1], contour[i2], 4.0, fineTriangles);
      }

      // 1. Camada Superior Curva e Lisa (Tampo 3D do país/continente)
      for (const [a, b, c] of fineTriangles) {
        const va = mapWorldLonLatToSphereVec3(a.x, a.y, outerR);
        const vb = mapWorldLonLatToSphereVec3(b.x, b.y, outerR);
        const vc = mapWorldLonLatToSphereVec3(c.x, c.y, outerR);

        posArr.push(va.x, va.y, va.z, vc.x, vc.y, vc.z, vb.x, vb.y, vb.z);
        // Normais esféricas suaves para brilho metálico contínuo!
        const na = va.clone().normalize();
        const nb = vb.clone().normalize();
        const nc = vc.clone().normalize();
        normArr.push(na.x, na.y, na.z, nc.x, nc.y, nc.z, nb.x, nb.y, nb.z);
      }

      // 2. Parede Costeira Lateral 3D Contínua (dá espessura real de peça usinada/impressa sem serrilhado!)
      for (let i = 0; i < contour.length; i++) {
        const pA = contour[i];
        const pB = contour[(i + 1) % contour.length];
        if (Math.abs(pB.x - pA.x) > 90) continue;

        const topA = mapWorldLonLatToSphereVec3(pA.x, pA.y, outerR);
        const topB = mapWorldLonLatToSphereVec3(pB.x, pB.y, outerR);
        const botA = mapWorldLonLatToSphereVec3(pA.x, pA.y, innerR);
        const botB = mapWorldLonLatToSphereVec3(pB.x, pB.y, innerR);

        const edge1 = new THREE.Vector3().subVectors(botB, botA);
        const edge2 = new THREE.Vector3().subVectors(topA, botA);
        const wallNorm = new THREE.Vector3().crossVectors(edge1, edge2).normalize();

        // Triângulo 1 da parede costeira
        posArr.push(botA.x, botA.y, botA.z, botB.x, botB.y, botB.z, topB.x, topB.y, topB.z);
        normArr.push(wallNorm.x, wallNorm.y, wallNorm.z, wallNorm.x, wallNorm.y, wallNorm.z, wallNorm.x, wallNorm.y, wallNorm.z);

        // Triângulo 2 da parede costeira
        posArr.push(botA.x, botA.y, botA.z, topB.x, topB.y, topB.z, topA.x, topA.y, topA.z);
        normArr.push(wallNorm.x, wallNorm.y, wallNorm.z, wallNorm.x, wallNorm.y, wallNorm.z, wallNorm.x, wallNorm.y, wallNorm.z);
      }
    }

    async function loadSmoothVectorContinents() {
      try {
        const res = await fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson');
        const geojson = await res.json();

        const innerR = RADIUS * 0.998;
        const worldOuterR = RADIUS * 1.052;
        const brazilOuterR = RADIUS * 1.072; // Brasil com destaque em alto-relevo

        const landPos = [], landNorm = [];
        const brPos = [], brNorm = [];

        for (const feat of geojson.features) {
          if (!feat.geometry) continue;
          const name = (feat.properties && feat.properties.name) || '';
          if (name === 'Antarctica') continue;
          const isBrazil = name === 'Brazil';

          const targetPos = isBrazil ? brPos : landPos;
          const targetNorm = isBrazil ? brNorm : landNorm;
          const targetR = isBrazil ? brazilOuterR : worldOuterR;

          if (feat.geometry.type === 'Polygon') {
            buildSmoothSphericalPolygonBuffers(feat.geometry.coordinates[0], innerR, targetR, targetPos, targetNorm);
          } else if (feat.geometry.type === 'MultiPolygon') {
            for (const poly of feat.geometry.coordinates) {
              buildSmoothSphericalPolygonBuffers(poly[0], innerR, targetR, targetPos, targetNorm);
            }
          }
        }

        const landGeo = new THREE.BufferGeometry();
        landGeo.setAttribute('position', new THREE.Float32BufferAttribute(landPos, 3));
        landGeo.setAttribute('normal', new THREE.Float32BufferAttribute(landNorm, 3));
        const landMesh = new THREE.Mesh(landGeo, continentArmorMat);
        continentsGroup.add(landMesh);

        const brGeo = new THREE.BufferGeometry();
        brGeo.setAttribute('position', new THREE.Float32BufferAttribute(brPos, 3));
        brGeo.setAttribute('normal', new THREE.Float32BufferAttribute(brNorm, 3));
        const brMesh = new THREE.Mesh(brGeo, brazilHighlightMat);
        continentsGroup.add(brMesh);

        statusText.textContent = 'Arraste para girar • Continentes Vetoriais Lisos + Luz Interna Invisível + Giro Diagonal';
      } catch (err) {
        statusText.textContent = 'Modelo 3D Carregado';
      }
    }

    loadSmoothVectorContinents();

    // =========================================================================
    // 3. LADO DA SUA LOGO "AARON.DEV": VAZADA COM BARRAS 3D GROSSAS E CHANFRO FINO
    // =========================================================================
    const logoGroup = new THREE.Group();
    coreGroup.add(logoGroup);

    const scale = RADIUS / 50;
    const tan18 = Math.tan((-18 * Math.PI) / 180);
    const INNER_R = 39;

    const outerRingShape = new THREE.Shape();
    outerRingShape.absarc(0, 0, 49.5 * scale, 0, Math.PI * 2, false);
    const outerHole = new THREE.Path();
    outerHole.absarc(0, 0, 42 * scale, 0, Math.PI * 2, true);
    outerRingShape.holes.push(outerHole);

    const outerRingMesh = new THREE.Mesh(
      new THREE.ExtrudeGeometry(outerRingShape, {
        depth: 0.34,
        bevelEnabled: true,
        bevelThickness: 0.06,
        bevelSize: 0.045,
        bevelSegments: 8,
        curveSegments: 96
      }),
      logoArmorMat
    );
    outerRingMesh.position.z = 0.02;
    logoGroup.add(outerRingMesh);

    function transformSvgPoint(px, py) {
      const xSvg = px + 16.25 + py * tan18;
      const ySvg = py;
      return { x: (xSvg - 50), y: -(ySvg - 50) };
    }

    function clipPolygonToCircleShape(svgPts, circleRadius) {
      const poly = svgPts.map(([px, py]) => transformSvgPoint(px, py));

      function insidePoly(x, y) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const xi = poly[i].x, yi = poly[i].y;
          const xj = poly[j].x, yj = poly[j].y;
          const intersect = ((yi > y) !== (yj > y)) &&
            (x < ((xj - xi) * (y - yi)) / (yj - yi + 1e-10) + xi);
          if (intersect) inside = !inside;
        }
        return inside;
      }

      const sampled = [];
      const stepsPerEdge = 100;
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i];
        const b = poly[(i + 1) % poly.length];
        for (let s = 0; s < stepsPerEdge; s++) {
          const t = s / stepsPerEdge;
          const px = a.x + (b.x - a.x) * t;
          const py = a.y + (b.y - a.y) * t;
          const dist = Math.hypot(px, py);
          if (dist <= circleRadius) {
            sampled.push({ x: px, y: py });
          } else {
            const cx = (px / dist) * circleRadius;
            const cy = (py / dist) * circleRadius;
            if (insidePoly(cx, cy)) sampled.push({ x: cx, y: cy });
          }
        }
      }

      const clean = [];
      for (const pt of sampled) {
        if (
          clean.length === 0 ||
          Math.hypot(pt.x - clean[clean.length - 1].x, pt.y - clean[clean.length - 1].y) > 0.08
        ) {
          clean.push(pt);
        }
      }

      if (clean.length < 3) return null;
      const shape = new THREE.Shape();
      shape.moveTo(clean[0].x * scale, clean[0].y * scale);
      for (let i = 1; i < clean.length; i++) {
        shape.lineTo(clean[i].x * scale, clean[i].y * scale);
      }
      shape.closePath();
      return shape;
    }

    function addLogoBlock(svgPolygon, depth, zOffset, material) {
      const shape = clipPolygonToCircleShape(svgPolygon, INNER_R);
      if (!shape) return;
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: true,
        bevelThickness: 0.055,
        bevelSize: 0.038,
        bevelSegments: 6
      });
      const mesh = new THREE.Mesh(geo, material);
      mesh.position.z = zOffset;
      logoGroup.add(mesh);
    }

    // LETRA "A" (Esquerda)
    addLogoBlock([[30, -20], [46, -20], [46, 120], [30, 120]], 0.34, 0.02, logoArmorMat);
    addLogoBlock([[-50, -20], [30, -20], [-2, 120], [-50, 120]], 0.34, 0.02, logoArmorMat);
    addLogoBlock([[-10, 55], [32, 55], [32, 73], [-10, 73]], 0.32, 0.02, logoArmorMat);

    // LINHA DIVISÓRIA CENTRAL
    addLogoBlock([[48.4, -20], [51.6, -20], [51.6, 120], [48.4, 120]], 0.24, 0.04, accentTitaniumMat);

    // LETRA "N" (Direita)
    addLogoBlock([[54, -20], [70, -20], [70, 120], [54, 120]], 0.34, 0.02, logoArmorMat);
    addLogoBlock([[94, -20], [150, -20], [150, 120], [94, 120]], 0.34, 0.02, logoArmorMat);
    addLogoBlock([[54, -20], [70, -20], [110, 120], [94, 120]], 0.35, 0.02, logoArmorMat);

    // =========================================================================
    // GIRO DIAGONAL CONTÍNUO & CONTROLES
    // =========================================================================
    let isDragging = false;
    let autoRotate = true;
    let targetRotY = null;
    let prevX = 0;
    let prevY = 0;

    container.addEventListener('pointerdown', e => {
      isDragging = true;
      targetRotY = null;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    window.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      coreGroup.rotation.y += dx * 0.01;
      coreGroup.rotation.x += dy * 0.008;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    document.getElementById('btnFaceMap').addEventListener('click', () => {
      autoRotate = false;
      targetRotY = Math.PI;
    });

    document.getElementById('btnFaceLogo').addEventListener('click', () => {
      autoRotate = false;
      targetRotY = 0;
    });

    document.getElementById('btnAuto').addEventListener('click', () => {
      targetRotY = null;
      autoRotate = true;
    });

    let isLight = false;
    document.getElementById('btnTheme').addEventListener('click', () => {
      isLight = !isLight;
      document.body.classList.toggle('light', isLight);
    });

    // Posição inicial mostrando o Globo Geodésico com inclinação diagonal
    coreGroup.rotation.y = Math.PI - 0.2;

    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging) {
        if (targetRotY !== null) {
          coreGroup.rotation.y += (targetRotY - coreGroup.rotation.y) * 0.08;
          coreGroup.rotation.x += (0 - coreGroup.rotation.x) * 0.08;
        } else if (autoRotate) {
          // Roda suavemente na diagonal (combinando rotação no eixo inclinado + leve precessão)
          coreGroup.rotation.y += 0.0065;
          coreGroup.rotation.x = Math.sin(coreGroup.rotation.y * 0.5) * 0.14;
        }
      }
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
