<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AARON.DEV // 3D Geodesic Lattice Globe V5 (Filled Black Countries + Diagonal Spin)</title>
  <style>
    :root {
      --bg: #050507;
      --text: #fafafa;
      --muted: #a1a1aa;
      --border: #27272a;
    }
    body.light {
      --bg: #f4f4f6;
      --text: #09090b;
      --muted: #52525b;
      --border: #d4d4d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.3s ease;
    }
    #canvas-container {
      width: 580px;
      height: 580px;
      position: relative;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }
    .hud {
      position: fixed;
      top: 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(24, 24, 27, 0.88);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .hud span {
      font-size: 12px;
      font-family: monospace;
      letter-spacing: 0.06em;
      color: #e4e4e7;
    }
    .btn {
      background: #18181b;
      color: #fff;
      border: 1px solid #3f3f46;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { border-color: #fff; transform: translateY(-1px); }
    .caption {
      margin-top: 6px;
      font-family: monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="hud">
    <span>// V5: PAÍSES 100% PREENCHIDOS EM PRETO SÓLIDO (ALTA RESOLUÇÃO) + GIRO DIAGONAL</span>
    <button class="btn" id="btnFaceMap">🌎 Focar Globo</button>
    <button class="btn" id="btnFaceLogo">🎯 Focar Logo 3D</button>
    <button class="btn" id="btnAuto">🔄 Giro Diagonal</button>
    <button class="btn" id="btnTheme">🌗 Tema</button>
  </div>

  <div id="canvas-container"></div>
  <div class="caption" id="statusText">Construindo países preenchidos em preto sólido com alta resolução...</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const statusText = document.getElementById('statusText');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000);
    camera.position.set(0, 0, 6.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(580, 580);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    container.appendChild(renderer.domElement);

    // Eixo inclinado na diagonal para girar na diagonal!
    const tiltPivot = new THREE.Group();
    tiltPivot.rotation.z = -0.45;
    tiltPivot.rotation.x = 0.18;
    scene.add(tiltPivot);

    const coreGroup = new THREE.Group();
    tiltPivot.add(coreGroup);

    // =========================================================================
    // ILUMINAÇÃO + LUZES INTERNAS INVISÍVEIS (Sem bola branca no meio!)
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.45);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.8);
    keyLight.position.set(5, 6, 7);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xd4d4d8, 2.8);
    fillLight.position.set(-6, -3, 5);
    scene.add(fillLight);

    const backRimLight = new THREE.DirectionalLight(0xffffff, 3.2);
    backRimLight.position.set(0, 5, -6);
    scene.add(backRimLight);

    // Luzes internas puras (Invisíveis! Só iluminam as frestas da logo e da grade)
    const innerLightCenter = new THREE.PointLight(0xffffff, 6.5, 5.5);
    innerLightCenter.position.set(0, 0, 0);
    coreGroup.add(innerLightCenter);

    const innerLightFront = new THREE.PointLight(0xffffff, 4.0, 4.5);
    innerLightFront.position.set(0, 0, 0.65);
    coreGroup.add(innerLightFront);

    const innerLightBack = new THREE.PointLight(0xe4e4e7, 4.0, 4.5);
    innerLightBack.position.set(0, 0, -0.65);
    coreGroup.add(innerLightBack);

    const RADIUS = 1.78;

    // Materiais em Preto Carbono / Ônix Fosco-Acetinado (como na foto da peça 3D!)
    const darkStrutMat = new THREE.MeshStandardMaterial({
      color: 0x16161b,
      roughness: 0.42,
      metalness: 0.48,
      side: THREE.DoubleSide
    });

    // Preenchimento Sólido Preto/Grafite Escuro dos Países
    const filledCountryBlackMat = new THREE.MeshStandardMaterial({
      color: 0x1e1e24,
      roughness: 0.34,
      metalness: 0.55,
      side: THREE.DoubleSide
    });

    // Leve destaque no Brasil (Preto Metálico Acetinado com relevo um pouco mais alto)
    const filledBrazilMat = new THREE.MeshStandardMaterial({
      color: 0x2c2c35,
      roughness: 0.26,
      metalness: 0.68,
      side: THREE.DoubleSide
    });

    const logoArmorMat = new THREE.MeshStandardMaterial({
      color: 0x222229,
      roughness: 0.25,
      metalness: 0.7,
      side: THREE.DoubleSide
    });

    const accentTitaniumMat = new THREE.MeshStandardMaterial({
      color: 0x71717a,
      roughness: 0.2,
      metalness: 0.85,
      side: THREE.DoubleSide
    });

    // =========================================================================
    // 1. GAIOLA GEODÉSICA TRIANGULAR VAZADA
    // =========================================================================
    function buildHollowGeodesicStruts(radius, detail, strutRadius) {
      const ico = new THREE.IcosahedronGeometry(radius, detail);
      const pos = ico.attributes.position;
      const edgesMap = new Map();

      function addEdge(i1, i2) {
        const v1 = new THREE.Vector3().fromBufferAttribute(pos, i1);
        const v2 = new THREE.Vector3().fromBufferAttribute(pos, i2);
        if (v1.z > 0.06 && v2.z > 0.06) return;

        const k1 = `${v1.x.toFixed(3)},${v1.y.toFixed(3)},${v1.z.toFixed(3)}`;
        const k2 = `${v2.x.toFixed(3)},${v2.y.toFixed(3)},${v2.z.toFixed(3)}`;
        const key = k1 < k2 ? `${k1}|${k2}` : `${k2}|${k1}`;
        if (!edgesMap.has(key)) {
          edgesMap.set(key, [v1, v2]);
        }
      }

      for (let i = 0; i < pos.count; i += 3) {
        addEdge(i, i + 1);
        addEdge(i + 1, i + 2);
        addEdge(i + 2, i);
      }

      const strutGroup = new THREE.Group();
      const up = new THREE.Vector3(0, 1, 0);

      for (const [v1, v2] of edgesMap.values()) {
        const dir = new THREE.Vector3().subVectors(v2, v1);
        const len = dir.length();
        const cylGeo = new THREE.CylinderGeometry(strutRadius, strutRadius, len, 10);
        const mesh = new THREE.Mesh(cylGeo, darkStrutMat);

        const mid = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);
        mesh.position.copy(mid);
        mesh.quaternion.setFromUnitVectors(up, dir.normalize());
        strutGroup.add(mesh);
      }

      return strutGroup;
    }

    const geodesicCage = buildHollowGeodesicStruts(RADIUS, 3, 0.022);
    coreGroup.add(geodesicCage);

    // Anel Equatorial Estrutural
    const equatorTorusGeo = new THREE.TorusGeometry(RADIUS, 0.052, 24, 108);
    coreGroup.add(new THREE.Mesh(equatorTorusGeo, logoArmorMat));

    // =========================================================================
    // 2. PAÍSES 100% PREENCHIDOS EM PRETO SÓLIDO COM RESOLUÇÃO ULTRA-ALTA
    // Usamos um Rasterizador Geográfico 2D em Canvas HD (1024x512) para testar
    // os países instantaneamente e geramos uma malha 3D contínua super fina
    // (360 x 180 células soldadas com normais suavizadas = ZERO buracos e alta definição!)
    // =========================================================================
    const continentsGroup = new THREE.Group();
    coreGroup.add(continentsGroup);

    function mapWorldLonLatToSphereVec3(lon, lat, r) {
      const centerLon = -38; // Brasil e Atlântico centralizados
      let dLon = lon - centerLon;
      while (dLon < -180) dLon += 360;
      while (dLon > 180) dLon -= 360;

      const azimuth = (dLon / 180) * (Math.PI * 0.485);
      const latRad = (lat * Math.PI) / 180 * 0.88;

      const x = -r * Math.cos(latRad) * Math.sin(azimuth);
      const y = r * Math.sin(latRad);
      const z = -r * Math.cos(latRad) * Math.cos(azimuth);
      return new THREE.Vector3(x, y, z);
    }

    async function loadHighResFilledCountries() {
      try {
        const res = await fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson');
        const geojson = await res.json();

        // 1. Desenha todos os países preenchidos num bitmap de alta precisão em memória
        // Canal R = Terra Firme | Canal G = Brasil
        const W = 1080;
        const H = 540;
        const offCanvas = document.createElement('canvas');
        offCanvas.width = W;
        offCanvas.height = H;
        const ctx = offCanvas.getContext('2d');
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, W, H);

        function lonToX(lon) { return ((lon + 180) / 360) * W; }
        function latToY(lat) { return ((90 - lat) / 180) * H; }

        function fillGeoRing(rings, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          rings.forEach((ring) => {
            ring.forEach(([lon, lat], i) => {
              const x = lonToX(lon);
              const y = latToY(lat);
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.closePath();
          });
          ctx.fill('evenodd');
        }

        for (const feat of geojson.features) {
          if (!feat.geometry) continue;
          const name = (feat.properties && feat.properties.name) || '';
          if (name === 'Antarctica') continue;
          const color = name === 'Brazil' ? '#00ff00' : '#ff0000';

          if (feat.geometry.type === 'Polygon') {
            fillGeoRing(feat.geometry.coordinates, color);
          } else if (feat.geometry.type === 'MultiPolygon') {
            for (const poly of feat.geometry.coordinates) {
              fillGeoRing(poly, color);
            }
          }
        }

        const imgData = ctx.getImageData(0, 0, W, H).data;
        function sampleLand(lon, lat) {
          const x = Math.max(0, Math.min(W - 1, Math.floor(lonToX(lon))));
          const y = Math.max(0, Math.min(H - 1, Math.floor(latToY(lat))));
          const idx = (y * W + x) * 4;
          if (imgData[idx + 1] > 128) return 2; // Brasil
          if (imgData[idx] > 128) return 1;     // Outros Países
          return 0;                             // Oceano (Vazado)
        }

        // 2. Constrói malha 3D preenchida de ALTA RESOLUÇÃO (320 x 160)
        // com topo esférico suave (normais esféricas) e paredes laterais apenas nas costas!
        const lonSteps = 320;
        const latSteps = 160;
        const innerR = RADIUS * 1.001;
        const outerR = RADIUS * 1.055;
        const brOuterR = RADIUS * 1.072;

        // Pré-calcula a matriz para saber exatamente onde é borda costeira (evita paredes internas!)
        const grid = Array.from({ length: lonSteps }, () => new Uint8Array(latSteps));
        for (let i = 0; i < lonSteps; i++) {
          const lonMid = -180 + ((i + 0.5) / lonSteps) * 360;
          for (let j = 0; j < latSteps; j++) {
            const latMid = -62 + ((j + 0.5) / latSteps) * 138;
            grid[i][j] = sampleLand(lonMid, latMid);
          }
        }

        const landPos = [], landNorm = [];
        const brPos = [], brNorm = [];

        function pushSmoothTopQuad(v00, v10, v11, v01, posArr, normArr) {
          // Normais esféricas puras no topo para parecer uma placa contínua lisa (sem aspecto quadriculado!)
          const n00 = v00.clone().normalize();
          const n10 = v10.clone().normalize();
          const n11 = v11.clone().normalize();
          const n01 = v01.clone().normalize();

          posArr.push(v00.x, v00.y, v00.z, v10.x, v10.y, v10.z, v11.x, v11.y, v11.z);
          normArr.push(n00.x, n00.y, n00.z, n10.x, n10.y, n10.z, n11.x, n11.y, n11.z);

          posArr.push(v00.x, v00.y, v00.z, v11.x, v11.y, v11.z, v01.x, v01.y, v01.z);
          normArr.push(n00.x, n00.y, n00.z, n11.x, n11.y, n11.z, n01.x, n01.y, n01.z);
        }

        function pushWallQuad(bA, bB, tB, tA, posArr, normArr) {
          const e1 = new THREE.Vector3().subVectors(bB, bA);
          const e2 = new THREE.Vector3().subVectors(tA, bA);
          const n = new THREE.Vector3().crossVectors(e1, e2).normalize();

          posArr.push(bA.x, bA.y, bA.z, bB.x, bB.y, bB.z, tB.x, tB.y, tB.z);
          normArr.push(n.x, n.y, n.z, n.x, n.y, n.z, n.x, n.y, n.z);

          posArr.push(bA.x, bA.y, bA.z, tB.x, tB.y, tB.z, tA.x, tA.y, tA.z);
          normArr.push(n.x, n.y, n.z, n.x, n.y, n.z, n.x, n.y, n.z);
        }

        for (let i = 0; i < lonSteps; i++) {
          const lon0 = -180 + (i / lonSteps) * 360;
          const lon1 = -180 + ((i + 1) / lonSteps) * 360;

          for (let j = 0; j < latSteps; j++) {
            const cell = grid[i][j];
            if (cell === 0) continue;

            const lat0 = -62 + (j / latSteps) * 138;
            const lat1 = -62 + ((j + 1) / latSteps) * 138;

            const isBr = cell === 2;
            const topR = isBr ? brOuterR : outerR;
            const pArr = isBr ? brPos : landPos;
            const nArr = isBr ? brNorm : landNorm;

            const t00 = mapWorldLonLatToSphereVec3(lon0, lat0, topR);
            const t10 = mapWorldLonLatToSphereVec3(lon1, lat0, topR);
            const t11 = mapWorldLonLatToSphereVec3(lon1, lat1, topR);
            const t01 = mapWorldLonLatToSphereVec3(lon0, lat1, topR);

            // Tampo 100% preenchido e contínuo
            pushSmoothTopQuad(t00, t10, t11, t01, pArr, nArr);

            // Cria parede lateral APENAS se o vizinho for oceano (borda do continente)
            const b00 = mapWorldLonLatToSphereVec3(lon0, lat0, innerR);
            const b10 = mapWorldLonLatToSphereVec3(lon1, lat0, innerR);
            const b11 = mapWorldLonLatToSphereVec3(lon1, lat1, innerR);
            const b01 = mapWorldLonLatToSphereVec3(lon0, lat1, innerR);

            if (j === 0 || grid[i][j - 1] !== cell) pushWallQuad(b00, b10, t10, t00, pArr, nArr);
            if (i === lonSteps - 1 || grid[i + 1][j] !== cell) pushWallQuad(b10, b11, t11, t10, pArr, nArr);
            if (j === latSteps - 1 || grid[i][j + 1] !== cell) pushWallQuad(b11, b01, t01, t11, pArr, nArr);
            if (i === 0 || grid[i - 1][j] !== cell) pushWallQuad(b01, b00, t00, t01, pArr, nArr);
          }
        }

        const landGeo = new THREE.BufferGeometry();
        landGeo.setAttribute('position', new THREE.Float32BufferAttribute(landPos, 3));
        landGeo.setAttribute('normal', new THREE.Float32BufferAttribute(landNorm, 3));
        continentsGroup.add(new THREE.Mesh(landGeo, filledCountryBlackMat));

        const brGeo = new THREE.BufferGeometry();
        brGeo.setAttribute('position', new THREE.Float32BufferAttribute(brPos, 3));
        brGeo.setAttribute('normal', new THREE.Float32BufferAttribute(brNorm, 3));
        continentsGroup.add(new THREE.Mesh(brGeo, filledBrazilMat));

        statusText.textContent = 'Arraste para girar • Países Preenchidos em Preto Sólido HD + Luz Invisível + Giro Diagonal';
      } catch (err) {
        statusText.textContent = 'Modelo 3D Carregado';
      }
    }

    loadHighResFilledCountries();

    // =========================================================================
    // 3. LADO DA SUA LOGO "AARON.DEV": VAZADA COM BARRAS 3D GROSSAS E CHANFRO FINO
    // =========================================================================
    const logoGroup = new THREE.Group();
    coreGroup.add(logoGroup);

    const scale = RADIUS / 50;
    const tan18 = Math.tan((-18 * Math.PI) / 180);
    const INNER_R = 39;

    const outerRingShape = new THREE.Shape();
    outerRingShape.absarc(0, 0, 49.5 * scale, 0, Math.PI * 2, false);
    const outerHole = new THREE.Path();
    outerHole.absarc(0, 0, 42 * scale, 0, Math.PI * 2, true);
    outerRingShape.holes.push(outerHole);

    const outerRingMesh = new THREE.Mesh(
      new THREE.ExtrudeGeometry(outerRingShape, {
        depth: 0.34,
        bevelEnabled: true,
        bevelThickness: 0.06,
        bevelSize: 0.045,
        bevelSegments: 8,
        curveSegments: 96
      }),
      logoArmorMat
    );
    outerRingMesh.position.z = 0.02;
    logoGroup.add(outerRingMesh);

    function transformSvgPoint(px, py) {
      const xSvg = px + 16.25 + py * tan18;
      const ySvg = py;
      return { x: (xSvg - 50), y: -(ySvg - 50) };
    }

    function clipPolygonToCircleShape(svgPts, circleRadius) {
      const poly = svgPts.map(([px, py]) => transformSvgPoint(px, py));

      function insidePoly(x, y) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const xi = poly[i].x, yi = poly[i].y;
          const xj = poly[j].x, yj = poly[j].y;
          const intersect = ((yi > y) !== (yj > y)) &&
            (x < ((xj - xi) * (y - yi)) / (yj - yi + 1e-10) + xi);
          if (intersect) inside = !inside;
        }
        return inside;
      }

      const sampled = [];
      const stepsPerEdge = 100;
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i];
        const b = poly[(i + 1) % poly.length];
        for (let s = 0; s < stepsPerEdge; s++) {
          const t = s / stepsPerEdge;
          const px = a.x + (b.x - a.x) * t;
          const py = a.y + (b.y - a.y) * t;
          const dist = Math.hypot(px, py);
          if (dist <= circleRadius) {
            sampled.push({ x: px, y: py });
          } else {
            const cx = (px / dist) * circleRadius;
            const cy = (py / dist) * circleRadius;
            if (insidePoly(cx, cy)) sampled.push({ x: cx, y: cy });
          }
        }
      }

      const clean = [];
      for (const pt of sampled) {
        if (
          clean.length === 0 ||
          Math.hypot(pt.x - clean[clean.length - 1].x, pt.y - clean[clean.length - 1].y) > 0.08
        ) {
          clean.push(pt);
        }
      }

      if (clean.length < 3) return null;
      const shape = new THREE.Shape();
      shape.moveTo(clean[0].x * scale, clean[0].y * scale);
      for (let i = 1; i < clean.length; i++) {
        shape.lineTo(clean[i].x * scale, clean[i].y * scale);
      }
      shape.closePath();
      return shape;
    }

    function addLogoBlock(svgPolygon, depth, zOffset, material) {
      const shape = clipPolygonToCircleShape(svgPolygon, INNER_R);
      if (!shape) return;
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: true,
        bevelThickness: 0.055,
        bevelSize: 0.038,
        bevelSegments: 6
      });
      const mesh = new THREE.Mesh(geo, material);
      mesh.position.z = zOffset;
      logoGroup.add(mesh);
    }

    // LETRA "A" (Esquerda)
    addLogoBlock([[30, -20], [46, -20], [46, 120], [30, 120]], 0.34, 0.02, logoArmorMat);
    addLogoBlock([[-50, -20], [30, -20], [-2, 120], [-50, 120]], 0.34, 0.02, logoArmorMat);
    addLogoBlock([[-10, 55], [32, 55], [32, 73], [-10, 73]], 0.32, 0.02, logoArmorMat);

    // LINHA DIVISÓRIA CENTRAL
    addLogoBlock([[48.4, -20], [51.6, -20], [51.6, 120], [48.4, 120]], 0.24, 0.04, accentTitaniumMat);

    // LETRA "N" (Direita)
    addLogoBlock([[54, -20], [70, -20], [70, 120], [54, 120]], 0.34, 0.02, logoArmorMat);
    addLogoBlock([[94, -20], [150, -20], [150, 120], [94, 120]], 0.34, 0.02, logoArmorMat);
    addLogoBlock([[54, -20], [70, -20], [110, 120], [94, 120]], 0.35, 0.02, logoArmorMat);

    // =========================================================================
    // GIRO DIAGONAL CONTÍNUO & CONTROLES
    // =========================================================================
    let isDragging = false;
    let autoRotate = true;
    let targetRotY = null;
    let prevX = 0;
    let prevY = 0;

    container.addEventListener('pointerdown', e => {
      isDragging = true;
      targetRotY = null;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    window.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      coreGroup.rotation.y += dx * 0.01;
      coreGroup.rotation.x += dy * 0.008;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    document.getElementById('btnFaceMap').addEventListener('click', () => {
      autoRotate = false;
      targetRotY = Math.PI;
    });

    document.getElementById('btnFaceLogo').addEventListener('click', () => {
      autoRotate = false;
      targetRotY = 0;
    });

    document.getElementById('btnAuto').addEventListener('click', () => {
      targetRotY = null;
      autoRotate = true;
    });

    let isLight = false;
    document.getElementById('btnTheme').addEventListener('click', () => {
      isLight = !isLight;
      document.body.classList.toggle('light', isLight);
    });

    coreGroup.rotation.y = Math.PI - 0.2;

    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging) {
        if (targetRotY !== null) {
          coreGroup.rotation.y += (targetRotY - coreGroup.rotation.y) * 0.08;
          coreGroup.rotation.x += (0 - coreGroup.rotation.x) * 0.08;
        } else if (autoRotate) {
          coreGroup.rotation.y += 0.0065;
          coreGroup.rotation.x = Math.sin(coreGroup.rotation.y * 0.5) * 0.14;
        }
      }
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
